<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌Astro Hub🌌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🌌ASTRO HUB🌌</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#games">Games</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>WELCOME TO ASTRO HUB</h2>
      <p>Your universe of games.</p>
      <a class="play-button" href="#games">Explore Games</a>
    </section>

     <section id="games">
  <h2>🎮Game Library🎮</h2>

  <input
    type="text"
    id="gameSearch"
    placeholder="Search games..."
  >

  <div class="categories">
    <button onclick="filterGames('All')">All</button>
    <button onclick="filterGames('Arcade')">Arcade</button>
    <button onclick="filterGames('Puzzle')">Puzzle</button>
    <button onclick="filterGames('Adventure')">Adventure</button>
  </div>

  <div class="game-grid" id="gameGrid"></div>
</section>

    <section id="about">
      <h2>About Astro Hub</h2>
      <p>A lightweight gaming portal, Made by astrobean_3d</p>
    </section>
  </main>

  <footer>cars are cool</footer>

  <script src="script.js"></script>
</body>
</html>
